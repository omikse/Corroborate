[package]
name = "corroborate"
version = "0.2.0"
edition = "2024"
description = "Live/Static audio-visual forensics using open source data"
default-run = "corroborate"
autobins = false

[dependencies]
hound = "3.5.1"
# Audio fingerprints (Wang landmarks) for the audio match: which recordings overlap, roughly where.
audiofp = { version = "=0.4.3", default-features = false }
realfft = "3.5.1"
# GUI only; `cargo build --no-default-features` gives the lean headless CLI and plugins.
eframe = { version = "0.36.0", optional = true, default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
# Offline maps in the location panel: local .pmtiles files (vector tiles, drawn with wgpu).
walkers = { version = "=0.62.0", optional = true, default-features = false, features = ["pmtiles", "mvt"] }
cpal = { version = "0.18.2", optional = true }
rfd = { version = "0.17.2", optional = true }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
rhai = { version = "1", features = ["no_module"] }

[dev-dependencies]
# Drives the workbench headless in tests and renders it to PNG (src/bin/corroborate/drive.rs).
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot"] }

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:cpal", "dep:rfd", "dep:walkers"]

# The workbench.
[[bin]]
name = "corroborate"
path = "src/bin/corroborate/main.rs"
required-features = ["gui"]

# Headless detectors: files or streams in, JSON lines out.
[[bin]]
name = "corroborate-cli"
path = "src/main.rs"

# Modules' own programs.
[[bin]]
name = "planes-view"
path = "src/modules/Planes (Doppler)/view.rs"
required-features = ["gui"]

[[bin]]
name = "enf-plugin"
path = "src/modules/ENF (power hum)/plugin.rs"

[[bin]]
name = "metadata"
path = "src/modules/Metadata/main.rs"

[[bin]]
name = "adsb-check"
path = "src/modules/ADS-B check/main.rs"

[profile.release]
lto = "thin"

# Development builds (run.cmd and the tests, both into target\fast): our code incremental at low
# optimisation, so a change rebuilds in seconds; libraries fully optimised, built once, so the
# FFT, decoding and drawing stay fast. No link-time optimisation. Like release otherwise (no
# console window, no debug assertions).
[profile.fast]
inherits = "release"
lto = false
incremental = true
codegen-units = 256
opt-level = 1

[profile.fast.package."*"]
opt-level = 3
