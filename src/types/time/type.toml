id = "time"
label = "Time"
color = "#7aa7e0"
flow = "value"
description = "A moment in UTC (Coordinated Universal Time) with its error, where it comes from, and which recording it belongs to: when the recording started, or when something happened. A time typed here is UTC."

[[field]]
name = "utc"
type = "datetime"
label = "time (UTC)"

[[field]]
name = "error_s"
type = "number"
label = "error"
unit = "s"
min = 0
default = 0

[[field]]
name = "source"
type = "text"
label = "where it comes from"

[[field]]
name = "recording"
type = "text"
label = "recording it belongs to (empty: none)"
