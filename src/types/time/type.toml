id = "time"
label = "Time"
color = "#7aa7e0"
flow = "value"
description = "A moment on a clock, with its error and, when known, its UTC (Coordinated Universal Time): when the recording started, or when something happened. A time typed here is UTC."

[[field]]
name = "utc"
type = "datetime"
label = "time (UTC)"

[[field]]
name = "error_s"
type = "number"
label = "error"
unit = "s"
min = 0
default = 0

[[field]]
name = "clock"
type = "text"
label = "clock (empty: UTC)"

[[field]]
name = "t"
type = "number"
label = "time on that clock"
unit = "s"

[[field]]
name = "source"
type = "text"
label = "where it comes from"
