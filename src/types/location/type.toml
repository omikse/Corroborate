id = "location"
label = "Location"
color = "#c785c9"
flow = "value"
description = "Where something is: an area of the Earth (1° cells), or a point with a radius around it."

[[field]]
name = "lat"
required = true
type = "number"
label = "latitude"
unit = "°"
min = -90
max = 90

[[field]]
name = "lon"
required = true
type = "number"
label = "longitude"
unit = "°"
min = -180
max = 180

[[field]]
name = "radius_km"
type = "number"
label = "radius"
unit = "km"
min = 0
default = 25

[[field]]
name = "elevation"
type = "number"
label = "elevation"
unit = "m"

[[field]]
name = "note"
type = "text"
