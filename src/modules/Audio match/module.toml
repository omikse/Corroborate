id = "audio-match"
label = "Audio match"
category = "Detectors"
order = 3
role = "detector"

# Each row is one recording: its audio, the time its metadata says it starts ("time 1", drawn as
# audio start time) and, optionally, when it ends ("end in 1", audio end time). Every pair of the
# wired recordings is matched. Files only for now: each source's own decoded audio is taken once it
# ends, then all are matched at once. The saved names stay as they were, so old wires hold.
[[input]]
name = "audio"
kind = "audio"
many = true

[[input]]
name = "time"
kind = "time"
many = true

[[input]]
name = "end in"
kind = "time"
many = true

[[output]]
name = "links"
kind = "link"
title = "links"
about = "Where two recordings hear the same sound: moment t_a on one clock is moment t_b on the other, each with an error from how clearly the audio matched. The node fits its own groups from them; until the global clock solve goes, they go into it too (wired or not)."
needs = ["audio", "audio 2"]
when = "recordings overlap in time and hear the same sounds"
source = "Wang 2003 (landmarks); Guggenberger, Lux, Böszörmenyi (AudioAlign); Knapp, Carter 1976 (GCC-PHAT)"
min_quality = "weak"

[[output]]
name = "edits"
kind = "event"
status = "possible"
about = "Where a recording's match with the others jumps: cuts, inserts, reordered parts (for the cut detector)."
needs = ["audio", "audio 2"]
when = "an edited recording overlaps an unedited one"
min_quality = "good"

[[output]]
name = "shared sounds"
kind = "event"
status = "possible"
about = "Sounds heard in several recordings (bangs, words), with the time each heard them."
needs = ["audio", "audio 2"]
when = "loud distinct sounds"
min_quality = "weak"

[[output]]
name = "sound source"
kind = "location"
status = "possible"
about = "Where a shared sound came from, by the differences in when the recordings heard it (TDOA, time difference of arrival)."
needs = ["audio", "audio 2", "audio 3", "locations of the recordings"]
when = "three or more recordings at known places"
min_quality = "good"

# Two per row: when the recording starts and ends ("synced 1" and "end 1", drawn as audio start
# time and audio end time), from the group's own fit of this node's links. Anchored: from the
# anchor's time, with the anchor's error and the fit's. Unanchored: where the metadata (or a drag)
# puts the group, with the row's own metadata error. The end is the start plus the length at the
# measured speed; a row audio did not link passes its wired end straight through. What the match
# finds besides (same recording, speed change, gaps) shows as marks in the row's Status cell, and
# goes into the result file with the quality and each pair's clock drift.
[[output]]
name = "synced"
kind = "time"
many = true

[[output]]
name = "end"
kind = "time"
many = true

[look]
status = false
