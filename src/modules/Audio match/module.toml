id = "audio-match"
label = "Audio match"
category = "Detectors"
order = 3
role = "detector"

# Grows as it is wired: "audio 1", "audio 2", … Every pair of the wired recordings is matched.
# Files only for now: each is decoded again here at 8 kHz once the graph runs, then all are
# matched at once.
[[input]]
name = "audio"
kind = "audio"
many = true

[[output]]
name = "links"
kind = "link"
title = "links"
about = "Where two recordings hear the same sound: moment t_a on one clock is moment t_b on the other, each with an error from how clearly the audio matched. They go into the clock solve (wired or not), which learns offsets and drift."
needs = ["audio", "audio 2"]
when = "recordings overlap in time and hear the same sounds"
source = "Wang 2003 (landmarks); Guggenberger, Lux, Böszörmenyi (AudioAlign); Knapp, Carter 1976 (GCC-PHAT)"
min_quality = "weak"

[[output]]
name = "quality"
kind = "quality"
title = "quality"
about = "How well the recordings matched: pairs linked, links, chunks tried, fingerprint candidates and those the cross-correlation did not confirm, per pair."
needs = ["audio", "audio 2"]
when = "always"
min_quality = "none"

[[output]]
name = "clock drift"
kind = "json"
title = "clock drift"
about = "For each pair whose links span 30 s or more: how fast one clock runs against the other (ppm, with its error), from a line through that pair's links alone. The clock solve learns drift from all links together; this is each pair's own view of it (on Jiku within 24 ppm of the truth, median)."
needs = ["audio", "audio 2"]
when = "long overlaps"
source = "Guggenberger, Lux, Böszörmenyi 2015"
min_quality = "good"

[[output]]
name = "same recording"
kind = "event"
title = "same recording"
about = "Two files that are one recording (a re-upload, a copy, a re-encode): not independent witnesses. An event on each file over the stretch they share, when their audio correlates over 0.8 (two phones at one event: 0.64 at most on Jiku; a video against its own audio: 1.000)."
needs = ["audio", "audio 2"]
when = "identical audio, no second microphone"
min_quality = "good"

[[output]]
name = "edits"
kind = "event"
status = "possible"
about = "Where a recording's match with the others jumps: cuts, inserts, reordered parts (for the cut detector)."
needs = ["audio", "audio 2"]
when = "an edited recording overlaps an unedited one"
min_quality = "good"

[[output]]
name = "shared sounds"
kind = "event"
status = "possible"
about = "Sounds heard in several recordings (bangs, words), with the time each heard them."
needs = ["audio", "audio 2"]
when = "loud distinct sounds"
min_quality = "weak"

[[output]]
name = "sound source"
kind = "location"
status = "possible"
about = "Where a shared sound came from, by the differences in when the recordings heard it (TDOA, time difference of arrival)."
needs = ["audio", "audio 2", "audio 3", "locations of the recordings"]
when = "three or more recordings at known places"
min_quality = "good"

[[output]]
name = "speed change"
kind = "event"
title = "speed change"
about = "A recording played faster or slower than it was recorded: its clock drift against another over 1000 ppm beyond 3 sigma, far past a quartz clock's 300. Fingerprints match up to about 1 % of speed change only; more is not found."
needs = ["audio", "audio 2"]
when = "long overlap"
min_quality = "good"

[[output]]
name = "gaps"
kind = "event"
status = "possible"
about = "Parts missing from one recording that the others have."
needs = ["audio", "audio 2"]
when = "overlapping recordings"
min_quality = "weak"
