id = "adsb-check"
label = "ADS-B check"
category = "Plugins"

[[input]]
name = "audio"
kind = "audio"
required = true

# The site: a location with latitude, longitude and elevation (m).
[[input]]
name = "place"
kind = "location"

# When the audio starts: wire the SOURCER's time.
[[input]]
name = "time"
kind = "time"

[[output]]
name = "findings"
kind = "event"

[[output]]
name = "facts"
kind = "json"

# When the audio starts and ends (UTC), from the heard passes matched to aircraft: each pass's
# closest approach is at the aircraft's heard time. The end needs two passes or more (it waits
# for the end of the audio); its error shows how well the passes measure the clock's speed.
[[output]]
name = "audio start time"
kind = "time"

[[output]]
name = "audio end time"
kind = "time"

[processing]
program = "adsb-check.exe"
protocol = 2
