id = "timeline"
label = "Timeline"
category = "View"
role = "view"

# Each row is one recording: its standard audio or video output, the time it starts (usually an
# Audio match row's audio start time) and, if known, the time it ends (audio end time). A recording
# with a start wired follows the real-time playhead: its moment t is at start + t, or with an end,
# t = (playhead - start) x length / (end - start).
[[input]]
name = "media"
kind = "any"
many = true

[[input]]
name = "time"
kind = "time"
many = true

[[input]]
name = "end"
kind = "time"
many = true

[look]
status = false
