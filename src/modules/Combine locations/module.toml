id = "combine-locations"
label = "Combine locations"
category = "Location"
order = 1
aliases = ["combine"]
role = "transform"

# Add node offers it twice: all + locations must hold, or any may.
[[variant]]
label = "Combine locations (all)"
mode = "all"

[[variant]]
label = "Combine locations (any)"
mode = "any"

# Grows as it is wired: "location 1", "location 2", …; each row has a sign (+ adds, − takes
# away), kept as a `minus <node id>` row.
[[input]]
name = "location"
kind = "location"
many = true

[[output]]
name = "location"
kind = "location"

# How the + rows join. all: every one must hold (AND). any: at least one may (OR). The − rows
# are then taken away.
[[setting]]
name = "mode"
type = "choice"
choices = ["all", "any"]
default = "all"
