id = "combine-locations"
label = "Combine locations"
category = "Location"
order = 1
aliases = ["combine"]
role = "transform"

# Add node offers it twice: all locations must hold, or any may.
[[variant]]
label = "Combine locations (all)"
mode = "all"

[[variant]]
label = "Combine locations (any)"
mode = "any"

# Grows as it is wired: "location 1", "location 2", …
[[input]]
name = "location"
kind = "location"
many = true

[[output]]
name = "location"
kind = "location"

# all: every wired location must hold (AND). any: at least one may (OR).
[[setting]]
name = "mode"
type = "choice"
choices = ["all", "any"]
default = "all"

[look]
size = [340, 132]
